[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maas-bundle-design"
version = "0.1.0"
description = "Models and algorithms for MaaS bundle design"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "networkx",
    "matplotlib",
    "PyYAML",
    "gurobipy",
    "pycddlib>=3.0",
]

[project.scripts]
maas-bundle = "maas_bundle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
]
markers = [
    "regional_scale: opt-in regional NLP tests with 100 and 1000 critical constraints",
    "enumeration_scale: opt-in exhaustive assignment-enumeration comparisons",
    "multistart_scale: opt-in repeated primal solves from multiple initial menus",
    "sioux_falls_scale: opt-in full 1,056-traveler Sioux Falls runs",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
